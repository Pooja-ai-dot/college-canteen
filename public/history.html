<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Order History</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 750px;
            margin: 30px auto;
            padding: 15px;
            background: #f4f6f8;
        }
        .panel {
            background: white;
            padding: 22px;
            border-radius: 10px;
            margin-top: 15px;
        }
        input, button {
            padding: 10px;
            margin-top: 8px;
        }
        input { width: 180px; }
        button { cursor: pointer; }
        li { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>My Order History</h1>

    <div class="panel">
        <label for="orderId">Enter your Order ID:</label>
        <br>
        <input id="orderId" type="number" min="1" required>
        <button onclick="findOrder()">Find Order</button>
        <p id="message"></p>
    </div>

    <div id="result"></div>

    <script>
        async function findOrder() {
            const orderId = document.getElementById("orderId").value;
            const message = document.getElementById("message");
            const result = document.getElementById("result");

            result.replaceChildren();

            if (!orderId || Number(orderId) < 1) {
                message.textContent = "Please enter a valid Order ID.";
                return;
            }

            message.textContent = "Searching for your order...";

            try {
                const response = await fetch(
                    "/api/orders/" + encodeURIComponent(orderId)
                );
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Order not found.");
                }

                message.textContent = "";

                const panel = document.createElement("div");
                panel.className = "panel";

                const heading = document.createElement("h2");
                heading.textContent = "Order #" + data.order.order_id;
                panel.appendChild(heading);

                function addText(text) {
                    const p = document.createElement("p");
                    p.textContent = text;
                    panel.appendChild(p);
                }

                addText("Order status: " + data.order.order_status);
                addText("Pickup time: " + (data.order.pickup_time || "Not set"));
                addText("Order total: ₹" +
                    Number(data.order.total_amount).toFixed(2));

                const itemHeading = document.createElement("h3");
                itemHeading.textContent = "Food Items";
                panel.appendChild(itemHeading);

                const list = document.createElement("ul");

                data.items.forEach(item => {
                    const li = document.createElement("li");
                    li.textContent =
                        item.item_name + " × " + item.quantity +
                        " — ₹" + Number(item.item_total).toFixed(2);
                    list.appendChild(li);
                });

                panel.appendChild(list);

                const paymentHeading = document.createElement("h3");
                paymentHeading.textContent = "Payment Details";
                panel.appendChild(paymentHeading);

                if (data.transactions.length === 0) {
                    addText("No transaction record found.");
                } else {
                    data.transactions.forEach(t => {
                        addText(
                            t.payment_method + " — " +
                            t.payment_status + " — ₹" +
                            Number(t.amount).toFixed(2)
                        );
                    });
                }

                result.appendChild(panel);
            } catch (error) {
                message.textContent = error.message;
            }
        }
    </script>
</body>
</html>
